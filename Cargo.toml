[package]
name = "kaleido-radio"
version = "0.1.0"
edition = "2024"
description = "KaleidoRadio desktop player, ported to Rust"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "accesskit", "persistence", "links"] }
rodio = { version = "0.21.1", default-features = false, features = ["playback"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rfd = "0.15"
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"
percent-encoding = "2"
walkdir = "2"
notify = "8"
roxmltree = "0.20"
rand = "0.9"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
lofty = "0.22"
ssh2 = "0.9"
tempfile = "3"
libc = "0.2"
libloading = "0.8"
# Pinned to eframe's winit, so the macOS borderless-game flag below
# applies to the same Window type eframe creates.
winit = "=0.30.13"

[profile.release]
lto = "thin"
strip = true

# macOS fullscreen child-window teardown can leave NSOpenGLContext without a view.
# Keep the native fix local and reproducible until the dependency provides it.
[patch.crates-io]
glutin = { path = "vendor/glutin" }
